name: Build Windows launcher
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Publish complete source archive
        uses: actions/upload-artifact@v4
        with:
          name: Zauch-Launcher-Source
          path: downloads/ZauchLauncher-source.zip
          if-no-files-found: error
      - name: Test, build and smoke-test executable
        shell: cmd
        run: build.bat
      - uses: actions/upload-artifact@v4
        with:
          name: Zauch-Launcher-Windows-x64
          path: dist/Zauch Launcher.exe
          if-no-files-found: error
